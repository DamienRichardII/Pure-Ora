<div class="cart-drawer__overlay" id="cart-overlay"></div>

    <h3 style="font-size:1.15rem;">Votre panier</h3>
    <button type="button" class="icon-btn" id="cart-close" aria-label="Fermer le panier">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
