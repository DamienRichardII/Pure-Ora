<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Pure Ora</title>
<meta name="description" content="Contactez l'équipe Pure Ora par formulaire, WhatsApp, Instagram ou TikTok.">
<link rel="canonical" href="https://www.pureora.com/contact.html">
<link rel="icon" href="favicon/favicon-v2.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32-v2.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16-v2.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon-v2.png?v=3">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=2">
<link rel="stylesheet" href="css/reset.css?v=2">
<link rel="stylesheet" href="css/global.css?v=2">
<link rel="stylesheet" href="css/components.css?v=2">
<link rel="stylesheet" href="css/animations.css?v=2">
<link rel="stylesheet" href="css/responsive.css?v=2">
</head>
<body>
<a href="#main-content" class="skip-link">Aller au contenu principal</a>
<div id="component-announcement"></div>
<div id="component-header"></div>
<main id="main-content">
  <div class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Accueil</a> / Contact</p>
      <span class="eyebrow">Nous contacter</span>
      <h1>Une question ? Nous sommes là.</h1>
    </div>
  </div>

  <section class="section section--white">
    <div class="container" style="display:grid;gap:var(--space-lg);grid-template-columns:1.3fr 0.9fr;">
      <form id="contact-form" data-po-form data-status-target="contact-status" novalidate enctype="multipart/form-data">
        <div class="form-field">
          <label for="contact-name">Nom</label>
          <input type="text" id="contact-name" name="name" required autocomplete="name">
        </div>
        <div class="form-field">
          <label for="contact-email">E-mail</label>
          <input type="email" id="contact-email" name="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="contact-phone">Téléphone (facultatif)</label>
          <input type="tel" id="contact-phone" name="phone" autocomplete="tel">
        </div>
        <div class="form-field">
          <label for="contact-order">Numéro de commande (facultatif)</label>
          <input type="text" id="contact-order" name="orderNumber">
        </div>
        <div class="form-field">
          <label for="contact-subject">Motif de la demande</label>
          <select id="contact-subject" name="subject" required>
            <option value="">Choisir un motif</option>
            <option value="information">Demande d'information</option>
            <option value="commande">Question sur une commande</option>
            <option value="defectueux">Article défectueux</option>
            <option value="retour">Retour ou remboursement</option>
            <option value="partenariat">Partenariat</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div class="form-field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" required></textarea>
        </div>
        <div class="form-field">
          <label for="contact-attachment">Pièce jointe (photo d'un article défectueux, facultatif)</label>
          <input type="file" id="contact-attachment" name="attachment" accept="image/*">
        </div>
        <input type="text" name="company" class="honeypot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-field form-field--checkbox">
          <input type="checkbox" id="contact-consent" name="consent" required>
          <label for="contact-consent">J'accepte que mes données soient utilisées pour traiter ma demande, conformément à la <a href="confidentialite.html" class="text-link">politique de confidentialité</a>.</label>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer le message</button>
        <div class="form-status" id="contact-status" hidden></div>
      </form>

      <aside>
        <div style="border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:var(--space-md);">
          <h3 style="font-size:1.1rem;margin-bottom:1rem;">Autres moyens de contact</h3>
          <ul style="display:flex;flex-direction:column;gap:.85rem;">
            <li><a href="https://instagram.com/pureora" target="_blank" rel="noopener" class="text-link" data-instagram-link>Instagram — @pureora</a></li>
            <li><a href="https://tiktok.com/@pureora" target="_blank" rel="noopener" class="text-link" data-tiktok-link>TikTok — @pureora</a></li>
            <li><a href="#" class="text-link" data-contact-email hidden></a></li>
          </ul>
          <p class="form-hint" style="margin-top:1rem;">Nous nous engageons à vous répondre dans les meilleurs délais.</p>
        </div>
      </aside>
    </div>
  </section>
</main>
<div id="component-footer"></div>
<div id="component-cart-drawer"></div>
<div id="component-cookie-banner"></div>
<div id="whatsapp-float-container"></div>
<script src="js/main.js?v=2"></script>
<script src="js/navigation.js?v=2"></script>
<script src="js/cart.js?v=2"></script>
<script src="js/animations.js?v=2"></script>
<script src="js/forms.js?v=2"></script>
<script src="js/cookies.js?v=2"></script>
<script src="js/tracking.js?v=2"></script>
</body>
</html>
