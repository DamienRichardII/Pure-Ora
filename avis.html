<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avis clients — Pure Ora</title>
<meta name="description" content="Découvrez les avis de nos clientes sur la postiche semi-naturelle Pure Ora.">
<link rel="canonical" href="https://www.pureora.com/avis.html">
<link rel="icon" href="favicon/favicon-v2.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32-v2.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16-v2.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon-v2.png?v=3">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=2">
<link rel="stylesheet" href="css/reset.css?v=2">
<link rel="stylesheet" href="css/global.css?v=2">
<link rel="stylesheet" href="css/components.css?v=2">
<link rel="stylesheet" href="css/animations.css?v=2">
<link rel="stylesheet" href="css/responsive.css?v=2">
</head>
<body>
<a href="#main-content" class="skip-link">Aller au contenu principal</a>
<div id="component-announcement"></div>
<div id="component-header"></div>
<main id="main-content">
  <div class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Accueil</a> / Avis clients</p>
      <span class="eyebrow">Témoignages</span>
      <h1>Ce qu'en disent nos clientes</h1>
    </div>
  </div>
  <section class="section section--white">
    <div class="container">
      <div class="gallery-grid" data-reviews-mount="published" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:var(--space-lg);"></div>

      <div class="section-head" style="margin-top:var(--space-lg);">
        <span class="eyebrow">Votre expérience</span>
        <h2>Partagez votre avis</h2>
      </div>
      <form id="review-form" data-po-form data-status-target="review-status" novalidate style="max-width:620px;">
        <div class="form-field">
          <label for="review-name">Prénom</label>
          <input type="text" id="review-name" name="firstName" required>
        </div>
        <div class="form-field">
          <label for="review-rating">Note</label>
          <select id="review-rating" name="rating" required>
            <option value="">Choisir une note</option>
            <option value="5">5 — Excellent</option>
            <option value="4">4 — Très bien</option>
            <option value="3">3 — Correct</option>
            <option value="2">2 — Décevant</option>
            <option value="1">1 — Insatisfait</option>
          </select>
        </div>
        <div class="form-field">
          <label for="review-text">Votre avis</label>
          <textarea id="review-text" name="text" required></textarea>
        </div>
        <div class="form-field">
          <label for="review-order">Numéro de commande (facultatif, pour vérification)</label>
          <input type="text" id="review-order" name="orderNumber">
        </div>
        <input type="text" name="company" class="honeypot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-field form-field--checkbox">
          <input type="checkbox" id="review-consent" name="consent" required>
          <label for="review-consent">J'accepte que mon avis soit examiné puis potentiellement publié par Pure Ora, conformément à la <a href="confidentialite.html" class="text-link">politique de confidentialité</a>.</label>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer mon avis</button>
      </form>
      <div class="form-status" id="review-status" hidden></div>
      <p class="form-hint" style="margin-top:1rem;">Les avis ne sont pas publiés automatiquement : ils sont examinés puis validés manuellement par notre équipe.</p>
    </div>
  </section>
</main>
<div id="component-footer"></div>
<div id="component-cart-drawer"></div>
<div id="component-cookie-banner"></div>
<div id="whatsapp-float-container"></div>
<script src="js/main.js?v=2"></script>
<script src="js/navigation.js?v=2"></script>
<script src="js/cart.js?v=2"></script>
<script src="js/animations.js?v=2"></script>
<script src="js/reviews.js?v=2"></script>
<script src="js/forms.js?v=2"></script>
<script src="js/cookies.js?v=2"></script>
<script src="js/tracking.js?v=2"></script>
</body>
</html>
